name: Build DKC1 Android v1.6.3 controls

on:
  push:
    branches:
      - build/android-v1.6.3-controls

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout DKC1 fork
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download build inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-0730-81fa-8231-a7d945186f55/raw?se=2026-09-24T18%3A25%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=dc881f6a-4a30-5ef6-ae92-2b6d544b4704&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T17%3A20%3A30Z&ske=2026-09-25T17%3A20%3A30Z&sks=b&skv=2026-02-06&sig=hbYMFp/WwLtY0G6Cmy7THqvq90aKJ6USX12udSQ%2B6Os%3D' -o /tmp/android-overlay.tar.xz
          curl --fail --location --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-fd9c-81f6-975f-22756c2435de/raw?se=2026-09-24T18%3A25%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=e8d13896-7f1f-5042-b92a-0950a2424691&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T17%3A59%3A10Z&ske=2026-09-25T17%3A59%3A10Z&sks=b&skv=2026-02-06&sig=64hv4m2GUzO19HlNvfT859NH3/Dk0XOL3cZfGpUqMKM%3D' -o /tmp/generated.tar.xz
          echo '6c1e6b1c639b196d2d237faf4dd8a9d36b6dd8db6bb66e83fa101da530d72f35  /tmp/android-overlay.tar.xz' | sha256sum -c -
          echo '672c55ed04061fd863007688d58d537c27e03635120fa74b94096af00d947298  /tmp/generated.tar.xz' | sha256sum -c -
          tar -xJf /tmp/android-overlay.tar.xz
          tar -xJf /tmp/generated.tar.xz
          grep -q "versionCode 113" android/app/build.gradle
          grep -q "versionName '1.6.3'" android/app/build.gradle
          grep -q 'nativeSetRewindHeld' android/app/src/main/java/com/ylports/dkc1recomp/GameActivity.java
          grep -q 'Seleccionado:' android/app/src/main/java/com/ylports/dkc1recomp/TouchControls.java
          grep -q 'continuous backwards motion' android/native/android_host.c
          ! grep -q 'Partida retrocedida' android/native/android_host.c

      - name: Prepare pinned snesrecomp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snesrecomp
          mkdir snesrecomp
          git -C snesrecomp init
          git -C snesrecomp remote add origin https://github.com/elliotttate/snesrecomp.git
          git -C snesrecomp fetch --depth 1 origin 851b11e38588818afc705e4270d3eb982b7b2af2
          git -C snesrecomp checkout --detach FETCH_HEAD
          git -C snesrecomp apply ../android/engine-patches/compat-v1.patch
          git -C snesrecomp apply ../android/engine-patches/native-module-v1.patch
          git apply android/engine-patches/native-module-host-v1.patch

      - name: Prepare pinned SDL2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/third_party/SDL2
          mkdir -p android/third_party/SDL2
          git -C android/third_party/SDL2 init
          git -C android/third_party/SDL2 remote add origin https://github.com/libsdl-org/SDL.git
          git -C android/third_party/SDL2 fetch --depth 1 origin c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
          git -C android/third_party/SDL2 checkout --detach FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build and lint release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 android/tools/gradle_runner.py --no-daemon :app:assembleRelease :app:lintRelease
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/build-tools
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/DKC1-Android-v1.6.3-controls-unsigned.apk
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." ci-output/build-tools/
          cp android/app/build/reports/lint-results-release.html ci-output/ || true
          sha256sum ci-output/DKC1-Android-v1.6.3-controls-unsigned.apk > ci-output/SHA256SUMS.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-android-v1.6.3-controls
          path: ci-output/
          retention-days: 1
          if-no-files-found: error
