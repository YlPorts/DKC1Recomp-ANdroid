name: Build DKC1 Android v1.6.4 audio video

on:
  push:
    branches:
      - build/android-v1.6.4-audio-video

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout DKC1 fork
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download build inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7c6c-8210-91f7-207f3f38f104/raw?se=2026-09-24T19%3A16%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=2114f968-1979-5df1-8eef-10336ca1a02f&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T18%3A32%3A05Z&ske=2026-09-25T18%3A32%3A05Z&sks=b&skv=2026-02-06&sig=wWFVE41VkBMU8jMVjoEfkHpUBvNZ76iaVcJCeJFwdhc%3D' -o /tmp/android-overlay.tar.xz
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-69b8-81f4-9e9c-a99c1311c2bd/raw?se=2026-09-24T19%3A17%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=d2afe822-75fc-5366-82d8-4107744dce51&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T18%3A20%3A56Z&ske=2026-09-25T18%3A20%3A56Z&sks=b&skv=2026-02-06&sig=yt6y8Y8SX7ks9KODe0Ur1uVLlenwihDJb9fuo9VEJ28%3D' -o /tmp/generated.tar.xz
          echo '8a691e2fc682a9d1a1f5df56829275f1e30a7a1146b52568d11abee644c18471  /tmp/android-overlay.tar.xz' | sha256sum -c -
          echo '66378c52a02929de27c2c50b9822f98128486ca95a3390745a5c41030f5849c1  /tmp/generated.tar.xz' | sha256sum -c -
          tar -xJf /tmp/android-overlay.tar.xz
          tar -xJf /tmp/generated.tar.xz
          grep -q "versionCode 114" android/app/build.gradle
          grep -q "versionName '1.6.4'" android/app/build.gradle
          grep -q 'nativeRequestRenderWidth' android/app/src/main/java/com/ylports/dkc1recomp/GameActivity.java
          grep -q 'Música (MSU-1)' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java
          grep -q 'OPT_MUSIC_VOLUME' android/native/android_host.c
          grep -q 'OPT_EFFECTS_VOLUME' android/native/android_host.c

      - name: Prepare pinned snesrecomp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snesrecomp
          mkdir snesrecomp
          git -C snesrecomp init
          git -C snesrecomp remote add origin https://github.com/elliotttate/snesrecomp.git
          git -C snesrecomp fetch --depth 1 origin 851b11e38588818afc705e4270d3eb982b7b2af2
          git -C snesrecomp checkout --detach FETCH_HEAD
          git -C snesrecomp apply ../android/engine-patches/compat-v1.patch
          git -C snesrecomp apply ../android/engine-patches/native-module-v1.patch
          git apply android/engine-patches/native-module-host-v1.patch

      - name: Prepare pinned SDL2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/third_party/SDL2
          mkdir -p android/third_party/SDL2
          git -C android/third_party/SDL2 init
          git -C android/third_party/SDL2 remote add origin https://github.com/libsdl-org/SDL.git
          git -C android/third_party/SDL2 fetch --depth 1 origin c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
          git -C android/third_party/SDL2 checkout --detach FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build and lint release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 android/tools/gradle_runner.py --no-daemon :app:assembleRelease :app:lintRelease
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/build-tools
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/DKC1-Android-v1.6.4-audio-video-unsigned.apk
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." ci-output/build-tools/
          cp android/app/build/reports/lint-results-release.html ci-output/ || true
          sha256sum ci-output/DKC1-Android-v1.6.4-audio-video-unsigned.apk > ci-output/SHA256SUMS.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-android-v1.6.4-audio-video
          path: ci-output/
          retention-days: 1
          if-no-files-found: error
