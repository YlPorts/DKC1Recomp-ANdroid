name: Split encrypted Android tool backup
on:
  push:
    branches: ['android/initial-port']
    paths: ['.github/workflows/android-split-kit.yml']
permissions:
  actions: read
  contents: read
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dkc1-encrypted-offline-tools
          run-id: 34711490385
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/incoming
      - name: Split encrypted data; never decrypt or read ROMs
        run: |
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 400M -d "$RUNNER_TEMP/incoming/tools.p7m" "$RUNNER_TEMP/parts/tools.p7m.part-"
          cd "$RUNNER_TEMP/parts"
          sha256sum tools.p7m.part-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dkc1-tools-encrypted-00
          path: ${{ runner.temp }}/parts/tools.p7m.part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dkc1-tools-encrypted-01
          path: ${{ runner.temp }}/parts/tools.p7m.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dkc1-tools-encrypted-02
          path: ${{ runner.temp }}/parts/tools.p7m.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dkc1-tools-checksums
          path: ${{ runner.temp }}/parts/SHA256SUMS.txt
          retention-days: 1
