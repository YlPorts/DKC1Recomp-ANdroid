name: Apply Android v0.2 source patch
on:
  push:
    branches: ['android/initial-port']
    paths: ['ci/android-v2-source.patch', '.github/workflows/android-apply-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/initial-port
          fetch-depth: 0
      - name: Apply reviewed source patch
        run: |
          git apply --check ci/android-v2-source.patch
          git apply ci/android-v2-source.patch
          git rm ci/android-v2-source.patch
          git config user.name 'YlPorts Android CI'
          git config user.email '133681884+YlPorts@users.noreply.github.com'
          git add android/native/android_host.c android/native/CMakeLists.txt android/app/build.gradle
          git commit -m 'android: add 21:9 ultrawide runtime and bump v0.2'
          git push origin HEAD:android/initial-port
