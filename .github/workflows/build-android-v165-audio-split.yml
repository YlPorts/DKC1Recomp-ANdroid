name: Build DKC1 Android v1.6.5 audio split

on:
  push:
    branches:
      - build/android-v1.6.5-audio-split

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout DKC1 fork
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download build inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-b53c-81fb-a0ec-299c5bc9a44c/raw?se=2026-09-24T19%3A40%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=4e0ef719-eb23-5fe4-b51e-5f1644f4508a&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T18%3A45%3A21Z&ske=2026-09-25T18%3A45%3A21Z&sks=b&skv=2026-02-06&sig=ORa5m1ajKtggNtteBA6Xnekhc%2B3PqBk/imyof9953Wk%3D' -o /tmp/android-overlay.tar.xz
          curl --fail --location --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-aa3c-81f5-88a5-ba715ed027c7/raw?se=2026-09-24T19%3A39%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=c73ab707-a434-5195-bfe0-58cf6914e0d0&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T19%3A14%3A11Z&ske=2026-09-25T19%3A14%3A11Z&sks=b&skv=2026-02-06&sig=IPZaEVinM0NRH4rhqRe0kHbmWewrzgjSFtIQelnJC4c%3D' -o /tmp/generated.tar.xz
          echo '00412a8d3da3da9679a517abe5c9374e34ec25414fa16e5649e857cf418378b5  /tmp/android-overlay.tar.xz' | sha256sum -c -
          echo '6cb35a5ed10df1421452ce327b74cd410ceb852f3cff60aef4ff637763b2c72b  /tmp/generated.tar.xz' | sha256sum -c -
          tar -xJf /tmp/android-overlay.tar.xz
          tar -xJf /tmp/generated.tar.xz
          grep -q "versionCode 115" android/app/build.gradle
          grep -q "versionName '1.6.5'" android/app/build.gradle
          grep -q 'slider(c,"Música"' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java
          grep -q 'slider(c,"Efectos"' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java
          grep -q 'Dkc1AndroidAudioNoteApuCommand' android/native/mod_hooks.c
          test -f android/engine-patches/audio-split-v1.patch

      - name: Prepare pinned snesrecomp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snesrecomp
          mkdir snesrecomp
          git -C snesrecomp init
          git -C snesrecomp remote add origin https://github.com/elliotttate/snesrecomp.git
          git -C snesrecomp fetch --depth 1 origin 851b11e38588818afc705e4270d3eb982b7b2af2
          git -C snesrecomp checkout --detach FETCH_HEAD
          git -C snesrecomp apply ../android/engine-patches/compat-v1.patch
          git -C snesrecomp apply ../android/engine-patches/native-module-v1.patch
          git apply android/engine-patches/native-module-host-v1.patch
          git -C snesrecomp apply ../android/engine-patches/audio-split-v1.patch
          grep -q 'dsp_audio_split_set_gains' snesrecomp/runner/src/snes/dsp.h
          grep -q 'hostSfxVoiceMask' snesrecomp/runner/src/snes/dsp.c

      - name: Prepare pinned SDL2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/third_party/SDL2
          mkdir -p android/third_party/SDL2
          git -C android/third_party/SDL2 init
          git -C android/third_party/SDL2 remote add origin https://github.com/libsdl-org/SDL.git
          git -C android/third_party/SDL2 fetch --depth 1 origin c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
          git -C android/third_party/SDL2 checkout --detach FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build and lint release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 android/tools/gradle_runner.py --no-daemon :app:assembleRelease :app:lintRelease
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/build-tools
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/DKC1-Android-v1.6.5-audio-split-unsigned.apk
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." ci-output/build-tools/
          cp android/app/build/reports/lint-results-release.html ci-output/ || true
          sha256sum ci-output/DKC1-Android-v1.6.5-audio-split-unsigned.apk > ci-output/SHA256SUMS.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-android-v1.6.5-audio-split
          path: ci-output/
          retention-days: 1
          if-no-files-found: error
