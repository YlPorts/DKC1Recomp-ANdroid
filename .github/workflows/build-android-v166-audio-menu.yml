name: Build DKC1 Android v1.6.6 audio menu

on:
  push:
    branches:
      - build/android-v1.6.6-audio-menu

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout DKC1 fork
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download build inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-8740-820c-8066-3f9734956a4e/raw?se=2026-09-24T23%3A32%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=51de0ba2-dfcd-573f-8596-1e4dc112d94c&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T23%3A21%3A13Z&ske=2026-09-25T23%3A21%3A13Z&sks=b&skv=2026-02-06&sig=myrfs8fu3hYIKPnshh7%2BENOGceYd3aie80OzMENHtmI%3D' -o /tmp/android-overlay.tar.xz
          curl --fail --location --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0e98-81f5-be3d-11066119bce1/raw?se=2026-09-24T23%3A32%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=ce4279ab-b638-5005-92f9-5ebc9b239fbe&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T22%3A50%3A19Z&ske=2026-09-25T22%3A50%3A19Z&sks=b&skv=2026-02-06&sig=2GJEcMb%2BH6g4CVa0izd%2BRXjlrfCOyNmeGBsK4ESNqbk%3D' -o /tmp/generated.tar.xz
          echo '16341286846545d1160edb12a4fe8abd7f3acfb8057901156149e69af07c8dc7  /tmp/android-overlay.tar.xz' | sha256sum -c -
          echo 'e0d36877cc39150b03b3a878fabd28533c09c46c1cbe77b7e889f07be1cbfec3  /tmp/generated.tar.xz' | sha256sum -c -
          tar -xJf /tmp/android-overlay.tar.xz
          tar -xJf /tmp/generated.tar.xz
          grep -q "versionCode 116" android/app/build.gradle
          grep -q "versionName '1.6.6'" android/app/build.gradle
          grep -q 'DKC1_SFX_OWNERSHIP = 0x01E0' android/tools/apply_audio_split.py
          grep -q 'card("Volumen",null)' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java
          ! grep -q 'Asistencia' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java
          ! grep -q 'Licencias' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java

      - name: Prepare pinned snesrecomp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snesrecomp
          mkdir snesrecomp
          git -C snesrecomp init
          git -C snesrecomp remote add origin https://github.com/elliotttate/snesrecomp.git
          git -C snesrecomp fetch --depth 1 origin 851b11e38588818afc705e4270d3eb982b7b2af2
          git -C snesrecomp checkout --detach FETCH_HEAD
          git -C snesrecomp apply ../android/engine-patches/compat-v1.patch
          git -C snesrecomp apply ../android/engine-patches/native-module-v1.patch
          git apply android/engine-patches/native-module-host-v1.patch
          python3 android/tools/apply_audio_split.py snesrecomp
          grep -q 'DKC1_SFX_OWNERSHIP' snesrecomp/runner/src/snes/dsp.c
          grep -q 'dsp_audio_split_set_gains' snesrecomp/runner/src/snes/dsp.h

      - name: Prepare pinned SDL2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/third_party/SDL2
          mkdir -p android/third_party/SDL2
          git -C android/third_party/SDL2 init
          git -C android/third_party/SDL2 remote add origin https://github.com/libsdl-org/SDL.git
          git -C android/third_party/SDL2 fetch --depth 1 origin c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
          git -C android/third_party/SDL2 checkout --detach FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build and lint release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 android/tools/gradle_runner.py --no-daemon :app:assembleRelease :app:lintRelease
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/build-tools
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/DKC1-Android-v1.6.6-audio-menu-unsigned.apk
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." ci-output/build-tools/
          cp android/app/build/reports/lint-results-release.html ci-output/ || true
          sha256sum ci-output/DKC1-Android-v1.6.6-audio-menu-unsigned.apk > ci-output/SHA256SUMS.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-android-v1.6.6-audio-menu
          path: ci-output/
          retention-days: 1
          if-no-files-found: error
