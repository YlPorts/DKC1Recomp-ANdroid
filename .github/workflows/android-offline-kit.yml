name: Android offline build dependencies
on:
  push:
    branches: ['android/initial-port']
    paths: ['ci/prepare_offline.py', 'ci/offline-recipient.pem', '.github/workflows/android-offline-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-offline-kit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare sources and encrypted dependencies (NO ROM)
        run: python3 ci/prepare_offline.py
      - name: Export public sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-public-sources
          path: ${{ runner.temp }}/dkc1-offline/sources.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Export encrypted private tool backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-encrypted-offline-tools
          path: ${{ runner.temp }}/dkc1-offline/tools.p7m
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
