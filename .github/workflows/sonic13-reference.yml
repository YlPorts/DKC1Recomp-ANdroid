name: Sonic 13 text reference
on:
  push:
    branches: ['android/initial-port']
    paths: ['.github/workflows/sonic13-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sonicretro/s2disasm
          ref: 380f37a731bfc720bb0371a35a593184a7ec5e43
          persist-credentials: false
      - name: Export textual research and binary fingerprints only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,zipfile,hashlib,json
          out=Path(os.environ['RUNNER_TEMP'])/'sonic13-reference.zip'
          index=[]
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() in ('.asm','.inc','.ini','.md','.lua'):
                z.write(p,p.as_posix())
              elif p.suffix.lower() in ('.bin','.nem') and any(s in p.as_posix().lower() for s in ('sonic','tails','palette')):
                b=p.read_bytes();index.append({'path':p.as_posix(),'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'prefix':b[:32].hex()})
            z.writestr('binary-fingerprints.json',json.dumps(index,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sonic13-reference
          path: ${{ runner.temp }}/sonic13-reference.zip
          retention-days: 1
          compression-level: 0
