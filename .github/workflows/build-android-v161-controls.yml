name: Build DKC1 Android v1.6.1 controls

on:
  push:
    branches:
      - build/android-v1.6.1-controls

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout DKC1 fork
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download private build inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c044-820e-99db-9f0412331625/raw?se=2026-09-24T16%3A09%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=ddb76be6-678c-51f4-a34a-8b5f435e1c47&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T15%3A41%3A07Z&ske=2026-09-25T15%3A41%3A07Z&sks=b&skv=2026-02-06&sig=%2Bis5XbInR3LO0lJSDBZpJ32KS/5gHhFhPCmZtfb490g%3D' -o /tmp/android-overlay.tar.xz
          curl --fail --location --retry 3 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-f274-81f8-9e53-77c2fdebe289/raw?se=2026-09-24T16%3A09%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=d8bbcbfb-6d6c-5900-a11b-4b25a30c5808&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T15%3A53%3A48Z&ske=2026-09-25T15%3A53%3A48Z&sks=b&skv=2026-02-06&sig=A9ettJXGURqCiFpQMkT9qdww%2BP4osfEBSt1voXOU5gM%3D' -o /tmp/generated.tar.xz
          echo 'f230f680f5211ba56b142fb6d4d809ddb9b4a3efb2793a89036351813d5455fc  /tmp/android-overlay.tar.xz' | sha256sum -c -
          echo 'd98260e2b0529ad1cecc56fd067bba57eb45339e6db8c1b8e60362b274a300e1  /tmp/generated.tar.xz' | sha256sum -c -
          tar -xJf /tmp/android-overlay.tar.xz
          tar -xJf /tmp/generated.tar.xz
          grep -q "versionCode 111" android/app/build.gradle
          grep -q "Mostrar botón de rebobinado" android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java
          grep -q "PadModel.REWIND" android/app/src/main/java/com/ylports/dkc1recomp/TouchControls.java

      - name: Prepare pinned snesrecomp without Dixie runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snesrecomp
          mkdir snesrecomp
          git -C snesrecomp init
          git -C snesrecomp remote add origin https://github.com/elliotttate/snesrecomp.git
          git -C snesrecomp fetch --depth 1 origin 851b11e38588818afc705e4270d3eb982b7b2af2
          git -C snesrecomp checkout --detach FETCH_HEAD
          git -C snesrecomp apply ../android/engine-patches/compat-v1.patch
          git -C snesrecomp apply ../android/engine-patches/native-module-v1.patch
          git apply android/engine-patches/native-module-host-v1.patch

      - name: Prepare pinned SDL2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/third_party/SDL2
          mkdir -p android/third_party/SDL2
          git -C android/third_party/SDL2 init
          git -C android/third_party/SDL2 remote add origin https://github.com/libsdl-org/SDL.git
          git -C android/third_party/SDL2 fetch --depth 1 origin c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
          git -C android/third_party/SDL2 checkout --detach FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build and lint release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 android/tools/gradle_runner.py --no-daemon :app:assembleRelease :app:lintRelease
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/build-tools
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/DKC1-Android-v1.6.1-controls-unsigned.apk
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." ci-output/build-tools/
          cp android/app/build/reports/lint-results-release.html ci-output/ || true
          sha256sum ci-output/DKC1-Android-v1.6.1-controls-unsigned.apk > ci-output/SHA256SUMS.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-android-v1.6.1-controls
          path: ci-output/
          retention-days: 1
          if-no-files-found: error
