name: Build DKC1 Android v1.6 upstream014

on:
  push:
    branches:
      - build/android-v1.6-upstream014

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout DKC1 fork
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download private build inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5040-81f5-bb94-6b472162f1e3/raw?se=2026-09-22T02%3A57%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=478f4965-ddd9-51df-81cb-0b2fca9f002e&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T23%3A24%3A07Z&ske=2026-09-22T23%3A24%3A07Z&sks=b&skv=2026-02-06&sig=yLbHIJ5rqxOidllCIXmnxBi/7pHY9oe6Uttsq%2BsHE/o%3D' -o /tmp/android-overlay.tar.xz
          curl --fail --location --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-bdc4-81f5-bf39-8938192b7235/raw?se=2026-09-22T02%3A58%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=a2efec8e-a82d-5065-9b0a-7af7686f47db&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T23%3A32%3A15Z&ske=2026-09-22T23%3A32%3A15Z&sks=b&skv=2026-02-06&sig=%2BoUNwtUbFmNtowpcPtFYu6jh6fQ46p35tINK/HfLmTI%3D' -o /tmp/generated.tar.xz
          echo '4a9fcbd1d864ef24de1213b3d4e77cfc39a2e9b04bb7cd9d8ba8eed3f8ad3141  /tmp/android-overlay.tar.xz' | sha256sum -c -
          echo '5e42ca04149ea60e9f6832f1c2cdb1c3a5f39d5f50da2789dee96b20ebe46c03  /tmp/generated.tar.xz' | sha256sum -c -
          tar -xJf /tmp/android-overlay.tar.xz
          mkdir -p generated
          tar -xJf /tmp/generated.tar.xz -C generated
          test -f android/app/build.gradle
          test -f generated/snesrecomp/android-generation.json

      - name: Prepare pinned snesrecomp without Dixie runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snesrecomp
          mkdir snesrecomp
          git -C snesrecomp init
          git -C snesrecomp remote add origin https://github.com/elliotttate/snesrecomp.git
          git -C snesrecomp fetch --depth 1 origin 851b11e38588818afc705e4270d3eb982b7b2af2
          git -C snesrecomp checkout --detach FETCH_HEAD
          git -C snesrecomp apply ../android/engine-patches/compat-v1.patch
          git -C snesrecomp apply ../android/engine-patches/native-module-v1.patch
          git apply android/engine-patches/native-module-host-v1.patch

      - name: Prepare pinned SDL2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/third_party/SDL2
          mkdir -p android/third_party/SDL2
          git -C android/third_party/SDL2 init
          git -C android/third_party/SDL2 remote add origin https://github.com/libsdl-org/SDL.git
          git -C android/third_party/SDL2 fetch --depth 1 origin c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
          git -C android/third_party/SDL2 checkout --detach FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --version

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build and lint release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 android/tools/gradle_runner.py --no-daemon :app:assembleRelease :app:lintRelease
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/build-tools
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/DKC1-Android-v1.6-upstream014-unsigned.apk
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." ci-output/build-tools/
          sha256sum ci-output/DKC1-Android-v1.6-upstream014-unsigned.apk > ci-output/SHA256SUMS.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-android-v1.6-upstream014
          path: ci-output/
          retention-days: 1
          if-no-files-found: error
