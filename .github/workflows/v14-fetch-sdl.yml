name: v14 pinned SDL source export
on:
  push:
    branches: ['android/initial-port']
    paths: ['.github/workflows/v14-fetch-sdl.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
          persist-credentials: false
      - name: Pack pinned SDL source
        run: tar -czf "$RUNNER_TEMP/SDL2-c98c4fb.tar.gz" --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: SDL2-c98c4fb-source
          path: ${{ runner.temp }}/SDL2-c98c4fb.tar.gz
          retention-days: 1
          compression-level: 0
