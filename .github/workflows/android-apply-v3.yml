name: Apply and test Android v0.3 source update
on:
  push:
    branches: ['android/initial-port']
    paths: ['ci/mobile-v3-source-05.b64']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/initial-port
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check reviewed source payload and apply
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,subprocess
          text=''.join(Path(f'ci/mobile-v3-source-{i:02}.b64').read_text().strip() for i in range(6))
          data=base64.b64decode(text,validate=True)
          assert hashlib.sha256(data).hexdigest()=='97d140f85458db5fff110ce59f1de306ef0ac52baed43f142f98e7b0cbc10506', 'Payload checksum mismatch'
          patch=lzma.decompress(data,memlimit=256*1024*1024)
          assert len(patch)==134754
          for line in patch.decode().splitlines():
              if line.startswith('+++ '):
                  path=line[4:].split('\t')[0]
                  assert path.startswith('b/android/') and '..' not in Path(path).parts
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Run source and backup tests without a ROM
        run: python3 android/tools/run_tests.py
      - name: Commit source and remove temporary transport
        shell: bash
        run: |
          git rm ci/mobile-v3-source-*.b64 ci/offline-recipient.pem .github/workflows/android-v3-tools.yml .github/workflows/android-apply-v3.yml
          git add android
          git diff --cached --check
          git config user.name 'YlPorts Android CI'
          git config user.email '133681884+YlPorts@users.noreply.github.com'
          git commit -m 'android: uniform controls, persistent ROM, PC-style settings and safe saves (v0.3)'
          git push origin HEAD:android/initial-port
