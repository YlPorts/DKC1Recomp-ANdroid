name: Build DKC1 Android v1.6.6 audio clean

on:
  push:
    branches:
      - build/android-v1.6.6-audio-clean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout DKC1 fork
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download build inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-d16c-820d-b8ea-b3fd6c70e4cb/raw?se=2026-09-24T23%3A51%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=c0912270-7ade-5849-8546-fb766c52a4a1&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T23%3A32%3A31Z&ske=2026-09-25T23%3A32%3A31Z&sks=b&skv=2026-02-06&sig=RSFnusgX9FRLFW6zF4KHfaFo8JpYiuj%2BqmHu5c5NDD4%3D' -o /tmp/android-overlay.tar.xz
          curl --fail --location --retry 3 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-ec30-81fb-bf8e-28b08de74166/raw?se=2026-09-24T23%3A51%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=067fa26e-6375-5bd4-96a8-d7315d378375&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T21%3A45%3A50Z&ske=2026-09-25T21%3A45%3A50Z&sks=b&skv=2026-02-06&sig=wzhqton3XP1LBYRAF7gRORAbdge/ya4KFvmc1NMiYbU%3D' -o /tmp/generated.tar.xz
          echo 'ad218dc543f79b00ad42bf268c7ff7c17b2c516edb8645751916c578f79827f9  /tmp/android-overlay.tar.xz' | sha256sum -c -
          echo 'eb5bb2e3adda8f8b17ddb7870b33a68a1ccb850391922345962ae31194b4f6ee  /tmp/generated.tar.xz' | sha256sum -c -
          tar -xJf /tmp/android-overlay.tar.xz
          tar -xJf /tmp/generated.tar.xz
          grep -q "versionCode 116" android/app/build.gradle
          grep -q "versionName '1.6.6'" android/app/build.gradle
          grep -q '0x01a0u + (unsigned)ch' android/tools/apply_audio_split.py
          ! grep -R -q 'hostPendingSfxCommands\|hostSfxVoiceMask' android/tools android/native
          grep -q 'LinearLayout c=card("Volumen",null)' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java
          ! grep -q 'experimental' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java
          ! grep -q 'PCM MSU-1 estéreo' android/app/src/main/java/com/ylports/dkc1recomp/OptionsPanel.java

      - name: Prepare pinned snesrecomp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snesrecomp
          mkdir snesrecomp
          git -C snesrecomp init
          git -C snesrecomp remote add origin https://github.com/elliotttate/snesrecomp.git
          git -C snesrecomp fetch --depth 1 origin 851b11e38588818afc705e4270d3eb982b7b2af2
          git -C snesrecomp checkout --detach FETCH_HEAD
          git -C snesrecomp apply ../android/engine-patches/compat-v1.patch
          git -C snesrecomp apply ../android/engine-patches/native-module-v1.patch
          git apply android/engine-patches/native-module-host-v1.patch
          python3 android/tools/apply_audio_split.py snesrecomp
          grep -q 'dsp->apu_ram\[0x01a0u + (unsigned)ch\]' snesrecomp/runner/src/snes/dsp.c
          ! grep -q 'hostPendingSfxCommands\|hostSfxVoiceMask' snesrecomp/runner/src/snes/dsp.c

      - name: Prepare pinned SDL2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/third_party/SDL2
          mkdir -p android/third_party/SDL2
          git -C android/third_party/SDL2 init
          git -C android/third_party/SDL2 remote add origin https://github.com/libsdl-org/SDL.git
          git -C android/third_party/SDL2 fetch --depth 1 origin c98c4fbff6d8f3016a3ce6685bf8f43433c3efcc
          git -C android/third_party/SDL2 checkout --detach FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build and lint release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 android/tools/gradle_runner.py --no-daemon :app:assembleRelease :app:lintRelease
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/build-tools
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/DKC1-Android-v1.6.6-audio-clean-unsigned.apk
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." ci-output/build-tools/
          cp android/app/build/reports/lint-results-release.html ci-output/ || true
          sha256sum ci-output/DKC1-Android-v1.6.6-audio-clean-unsigned.apk > ci-output/SHA256SUMS.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: dkc1-android-v1.6.6-audio-clean
          path: ci-output/
          retention-days: 1
          if-no-files-found: error
